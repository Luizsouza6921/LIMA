<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Simples</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff0000, #ff4040, #ff6565, #ffa7a7, #ffcdcd);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .calc{
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
    }
    h2{
      text-align: center;
      margin-bottom: 16px;
    }
    .campo{
      margin-bottom: 14px;
    }
    input{
      width: 300px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #000000;
      font-size: 16px;
      outline: none;
    }
    .botoes{
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    button{
      padding: 12px;
      border: none;
      background: #4b8aff;
      color: rgb(255, 255, 255);
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover{
      opacity: 0.8;
    }
    .reset{
      grid-column: span 4;
      background: #ff0000;
    }
    .resultado{
      margin-top: 18px;
      padding: 12px;
      background: #ffffff;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      min-height: 32px;
    }
  </style>
</head>
<body>
  <div class="calc">
    <h2>Calculadora</h2>

    <div class="campo">
      <input type="number" id="n1" placeholder="Digite o primeiro número">
    </div>

    <div class="campo">
      <input type="number" id="n2" placeholder="Digite o segundo número">
    </div>

    <div class="botoes">
      <button onclick="operacao('+')">+</button>
      <button onclick="operacao('-')">-</button>
      <button onclick="operacao('*')">×</button>
      <button onclick="operacao('/')">÷</button>
      <button class="reset" onclick="resetar()">Reset</button>
    </div>

    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    function operacao(op){
      let n1 = parseFloat(document.getElementById('n1').value);
      let n2 = parseFloat(document.getElementById('n2').value);
      let res = document.getElementById('resultado');

      if(isNaN(n1) || isNaN(n2)){
        res.textContent = "Digite dois números válidos!";
        return;
      }

      let r = 0;
      switch(op){
        case '+': r = n1 + n2; break;
        case '-': r = n1 - n2; break;
        case '*': r = n1 * n2; break;
        case '/':
          if(n2 === 0){
            res.textContent = "Não é possível dividir por zero";
            return;
          }
          r = n1 / n2;
          break;
      }

      res.textContent = "Resultado: " + r;
    }

    function resetar(){
      document.getElementById('n1').value = "";
      document.getElementById('n2').value = "";
      document.getElementById('resultado').textContent = "Resultado aparecerá aqui";
    }
  </script>
</body>
</html>

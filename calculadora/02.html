<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Verificações</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f0f0f0; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        input { padding: 10px; width: 100%; margin: 10px 0; font-size: 18px; }
        button { padding: 12px 20px; font-size: 18px; background: #3498db; color: white; border: none; cursor: pointer; }
        button:hover { background: #2980b9; }
        .resultado { margin-top: 20px; line-height: 2; }
        .sim { color: green; font-weight: bold; }
        .nao { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CALCULADORA DE VERIFICAÇÕES</h1>
        
        <label>Primeiro número:</label>
        <input type="number" id="num1" required>
        
        <label>Segundo número:</label>
        <input type="number" id="num2" required>
        
        <button onclick="calcular()">VERIFICAR TUDO</button>
        
        <div id="saida" class="resultado"></div>
    </div>

    <script>
        function calcular() {
            // Pegando os valores
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);

            // Validação básica
            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById('saida').innerHTML = "<span class='nao'>Por favor, digite dois números válidos!</span>";
                return;
            }

            let resultado = "<h3>RESULTADOS:</h3>";

            // 1. Primeiro número é maior que o segundo?
            resultado += num1 > num2 
                ? "<div class='sim'>✓ O primeiro número é MAIOR que o segundo.</div>"
                : "<div class='nao'>✗ O primeiro número NÃO é maior que o segundo.</div>";

            // 2. Ambos são pares?
            resultado += (num1 % 2 === 0 && num2 % 2 === 0)
                ? "<div class='sim'>✓ Ambos os números são PARES.</div>"
                : "<div class='nao'>✗ Pelo menos um dos números é ÍMPAR.</div>";

            // 3. Primeiro número é múltiplo do segundo?
            if (num2 !== 0 && num1 % num2 === 0) {
                resultado += `<div class='sim'>✓ ${num1} é MÚLTIPLO de ${num2}.</div>`;
            } else {
                resultado += num2 === 0 
                    ? "<div class='nao'>✗ Não é possível verificar múltiplo (divisão por zero).</div>"
                    : `<div class='nao'>✗ ${num1} NÃO é múltiplo de ${num2}.</div>`;
            }

            // 4. Ambos os números são iguais?
            resultado += num1 === num2
                ? "<div class='sim'>✓ Os dois números são IGUAIS.</div>"
                : "<div class='nao'>✗ Os dois números são DIFERENTES.</div>";

            // 5. A soma dos dois números é par ou ímpar?
            const soma = num1 + num2;
            resultado += (soma % 2 === 0)
                ? `<div class='sim'>✓ A soma (${soma}) é PAR.</div>`
                : `<div class='nao'>✗ A soma (${soma}) é ÍMPAR.</div>`;

            // 6. A soma é maior que 10?
            resultado += soma > 10
                ? `<div class='sim'>✓ A soma (${soma}) é MAIOR que 10.</div>`
                : `<div class='nao'>✗ A soma (${soma}) NÃO é maior que 10.</div>`;

            // 7. Primeiro número é ímpar e o segundo é par?
            resultado += (num1 % 2 !== 0 && num2 % 2 === 0)
                ? "<div class='sim'>✓ O primeiro é ÍMPAR e o segundo é PAR.</div>"
                : "<div class='nao'>✗ O primeiro NÃO é ímpar OU o segundo NÃO é par.</div>";

            // 8. Primeiro número é negativo?
            resultado += num1 < 0
                ? "<div class='sim'>✓ O primeiro número é NEGATIVO.</div>"
                : "<div class='nao'>✗ O primeiro número NÃO é negativo.</div>";

            document.getElementById('saida').innerHTML = resultado;
        }
    </script>
</body>
</html>

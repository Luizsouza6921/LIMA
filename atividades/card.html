<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Criando um card personalizado com TaiwindCss</title>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">
    <div class="max-w-sm mx-auto bg-white rounded-lg overflow-hidden md:max-w-2x1">
        <div class="flex">
            <div class="md-shrink-0">
                <img src="Lz2.png" alt="imagem dev" class="h-full w-full object-cover md:h-full md:w-full">
            </div>
            <div class="p-8">
                <div class="uppercase tracking-wide text-sm text-red-500 font-semibold">Desenvolvedor Web</div>
                <h1 class="block mt-1text-lg leading-light font-medium text-orange-600"></h1>
                <p class="mt-2 text-slate-5000">O seu desenvolvedor web perfeito para solucionar seus problemas de desenvolvimento.
                    Conhecido Como Luiz Gustavo .
                </p>

                <div class="mt-6">
                    <a href="#" class="inline-block bg-red-500 text-white font-bold py-2 px-4 rounded-lg shadow">Entrar em contato</a>
                </div>
            </div>
        </div>

    </div>
   
</body>
</html>

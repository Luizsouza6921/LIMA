<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewpomrt" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Criando Form com Tailwind</title>
</head>

<body class="bg-yellow-500 h-screen flex items-center justify-center">
    <form action="" class="bg-white p-5 rounded-lg shadow max-w-md h-90 space-y-4">
        <div>
            <label for="nome" class="block text-sm font-medium mb-1">Nome</label>
            <input type="text" id="nome" class="w-full border px-4 py-4 rounded">
        </div>
        <div></div>
            <label for="Email" class="block text-sm font-medium mb-1">Email</label>
            <input type="Email" id="Email" class="w-full border px-4 py-4 rounded">
        </div>
        <div>
            <label for="msg" class="block text-sm font-medium mb-1">Mensagem</label>
            <textarea type="text" id="msg" class="w-full border px-4 py-4 rounded"> </textarea>
        </div>
        <div class="text-center" 
        <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 transition duration-300">Enviar</button>
   
    </div>
    </form>
</body>

</html>
